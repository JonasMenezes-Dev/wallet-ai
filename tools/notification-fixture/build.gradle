plugins {
  // Same AGP version as the existing React Native Gradle version catalog.
  id 'com.android.application' version '8.12.0'
}

android {
  namespace 'com.walletai.notificationfixture'
  compileSdk 36

  defaultConfig {
    applicationId 'com.walletai.notificationfixture'
    minSdk 26
    targetSdk 36
    versionCode 1
    versionName '1.0-dev'
  }

  buildTypes {
    debug { debuggable true }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

// This tool has no release artifact and no third-party runtime dependencies.
androidComponents {
  beforeVariants(selector().withBuildType('release')) { variant ->
    variant.enable = false
  }
}

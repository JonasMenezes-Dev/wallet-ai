name: Quality checks

on:
  push:
    branches: [main, beta-0.1-stability]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Notification parser tests
        run: node --experimental-strip-types --test tests/notification-import.test.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint
